name: Build Installable The Trend Lab Admin APK
on:
  push:
    branches: [admin-apk-build]
    paths:
      - 'admin-app/**'
      - '.github/workflows/build-admin-apk.yml'
      - 'admin-app-update.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: admin-apk-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare full-size Admin app icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          src = Image.open('admin-app/app/src/main/res/drawable/admin_icon.jpg').convert('RGB')
          icon = ImageOps.fit(src, (512, 512), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          icon.save('admin-app/app/src/main/res/drawable/ic_launcher.png', optimize=True)
          PY
      - name: Build signed Admin APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p admin-app assembleRelease
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-v1.0.3
          name: The Trend Lab Admin v1.0.3
          body: Signed Admin APK with in-app update support.
          files: admin-app/app/build/outputs/apk/release/app-release.apk
          make_latest: false
