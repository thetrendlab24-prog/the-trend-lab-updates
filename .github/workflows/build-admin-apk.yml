name: Build Installable The Trend Lab Admin APK
on:
  push:
    branches: [admin-apk-build]
    paths:
      - 'admin-app/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: admin-apk-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare full-size Admin app icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          src = Image.open('admin-app/app/src/main/res/drawable/admin_icon.jpg').convert('RGB')
          icon = ImageOps.fit(src, (512, 512), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          icon.save('admin-app/app/src/main/res/drawable/ic_launcher.png', optimize=True)
          PY
      - name: Build signed release Admin APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing Admin APK signing secrets. Add the four ANDROID_KEYSTORE_* GitHub Actions secrets." && exit 1)
          gradle --no-daemon -p admin-app assembleRelease
      - name: Prepare release metadata
        id: meta
        run: |
          APK=admin-app/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish versioned Admin APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-v1.0.10
          name: The Trend Lab Admin v1.0.10
          body: "Prevents login-screen flash during saved-session restoration by synchronizing the native splash with page readiness."
          files: admin-app/app/build/outputs/apk/release/app-release.apk
          make_latest: false
      - name: Update in-app update manifest
        env:
          APK_SHA256: ${{ steps.meta.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          path = "admin-app-update.json"
          data = {
            "versionCode": 11,
            "versionName": "1.0.10",
            "apkUrl": "https://github.com/thetrendlab24-prog/the-trend-lab-updates/releases/download/admin-v1.0.6/app-release.apk",
            "apkSha256": os.environ["APK_SHA256"],
            "forceUpdate": False,
            "releaseNotes": "Improved startup splash synchronization to prevent saved-session login flash."
          }
          with open(path, "w") as f: json.dump(data, f, indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-app-update.json
          git commit -m "Publish Admin v1.0.10 in-app update manifest"
          git push