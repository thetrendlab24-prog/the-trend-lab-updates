name: Build The Trend Lab Customer APK

on:
  workflow_dispatch:
  push:
    branches:
      - fresh-customer-app-cloud-build
    paths-ignore:
      - 'app-update.json'

permissions:
  contents: write

concurrency:
  group: customer-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare full-size launcher icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = 'app/src/main/res/drawable/ic_launcher.webp'
          im = Image.open(src).convert('RGB')
          im = im.resize((512, 512), Image.Resampling.LANCZOS)
          im.save('app/src/main/res/drawable/ic_launcher_fixed.png', optimize=True)
          PY

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Calculate APK SHA-256
        id: apk_hash
        shell: bash
        run: |
          APK_SHA256=$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
          test -n "$APK_SHA256"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Trend-Lab-Customer-v${{ steps.app_version.outputs.version_name }}-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-v${{ steps.app_version.outputs.version_name }}
          name: The Trend Lab Customer App v${{ steps.app_version.outputs.version_name }}
          body: |
            The Trend Lab Customer App v${{ steps.app_version.outputs.version_name }}.
            Built automatically from the current app version.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true

      - name: Publish in-app update metadata
        uses: actions/github-script@v7
        env:
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_APK_SHA256: ${{ steps.apk_hash.outputs.apk_sha256 }}
        with:
          script: |
            const path = "app-update.json";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "fresh-customer-app-cloud-build";
            const current = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            const metadata = {
              versionCode: Number(process.env.APP_VERSION_CODE),
              versionName: process.env.APP_VERSION_NAME,
              apkUrl: "https://github.com/" + owner + "/" + repo + "/releases/download/customer-v" + process.env.APP_VERSION_NAME + "/app-release.apk",
              apkSha256: process.env.APP_APK_SHA256,
              releaseNotes: "The Trend Lab Customer App v" + process.env.APP_VERSION_NAME + " is available.",
              forceUpdate: false
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: "Publish in-app update metadata for v" + process.env.APP_VERSION_NAME,
              sha: current.data.sha,
              content: Buffer.from(JSON.stringify(metadata, null, 2) + "\n").toString("base64")
            });
