name: Build The Trend Lab Customer APK

on:
  workflow_dispatch:
  push:
    branches:
      - fresh-customer-app-cloud-build
    paths-ignore:
      - 'app-update.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare full-size launcher icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = 'app/src/main/res/drawable/ic_launcher.webp'
          im = Image.open(src).convert('RGB')
          # Scale the complete square artwork to fill the launcher canvas.
          # thumbnail() only downsizes and left the 96px source tiny on 512px.
          im = im.resize((512, 512), Image.Resampling.LANCZOS)
          im.save('app/src/main/res/drawable/ic_launcher_fixed.png', optimize=True)
          PY
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Trend-Lab-Customer-v2.9.4-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-v2.9.4
          name: The Trend Lab Customer App v2.9.4
          body: |
            The Trend Lab Customer App v2.9.4.
            Launcher icon correction and automatic in-app update metadata.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
      - name: Publish in-app update metadata
        uses: actions/github-script@v7
        with:
          script: |
            const path = "app-update.json";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "fresh-customer-app-cloud-build";
            const current = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            const metadata = {
              versionCode: 7,
              versionName: "2.9.4",
              apkUrl: "https://github.com/" + owner + "/" + repo + "/releases/latest/download/app-release.apk",
              releaseNotes: "The Trend Lab Customer App v2.9.4: launcher icon correction and improvements.",
              forceUpdate: false
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: "Publish in-app update metadata for v2.9.4",
              sha: current.data.sha,
              content: Buffer.from(JSON.stringify(metadata, null, 2) + "\\n").toString("base64")
            });
