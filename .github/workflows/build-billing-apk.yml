name: Build The Trend Lab Separate Billing APK
on:
  push:
    branches: [billing-pos-apk]
    paths:
      - 'billing-app/**'
      - '.github/workflows/build-billing-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: billing-apk-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed Billing APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing Android signing secrets." && exit 1)
          gradle --no-daemon -p billing-app assembleRelease
      - name: Verify APK and calculate SHA-256
        id: meta
        run: |
          APK=billing-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish separate Billing APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: billing-v1.0.0
          name: The Trend Lab Billing v1.0.0
          body: "Separate Android billing counter app. Opens the deployed non-GST POS billing screen."
          files: billing-app/app/build/outputs/apk/release/app-release.apk
          make_latest: false
